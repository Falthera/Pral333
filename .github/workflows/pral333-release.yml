name: PRAL333 Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  Release:
    name: Build and release
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install GCC 11
        uses: egor-tensin/setup-gcc@a2861a8b8538f49cf2850980acccf6b05a1b2ae4 # v2.0
        with:
          version: 11

      - name: Download the used network from the fishtest framework
        run: make net

      - name: Build release binary
        run: |
          make clean
          make -j4 profile-build ARCH=x86-64-bmi2 COMP=gcc
          make strip ARCH=x86-64-bmi2 COMP=gcc
          mv stockfish ../pral333-linux-x86-64-bmi2

      - name: Package release files
        run: |
          cd ..
          mkdir pral333-release
          cp pral333-linux-x86-64-bmi2 pral333-release/
          cp README.md pral333-release/
          cp Copying.txt pral333-release/
          cp AUTHORS pral333-release/
          cp CITATION.cff pral333-release/
          cp "Top CPU Contributors.txt" pral333-release/
          cp CONTRIBUTING.md pral333-release/
          tar -czf pral333-${{ github.ref_name }}-linux-x86-64-bmi2.tar.gz pral333-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: PRAL333 ${{ github.ref_name }}
          generate_release_notes: true
          files: pral333-${{ github.ref_name }}-linux-x86-64-bmi2.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
